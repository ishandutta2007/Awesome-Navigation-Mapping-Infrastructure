<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradient for Title & Glows -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e3a8a; stroke-opacity: 0.25; stroke-width: 1; }
    .route-path {
      stroke: url(#routeGrad);
      stroke-width: 3.5;
      fill: none;
      stroke-dasharray: 12, 6;
      animation: dash 25s linear infinite;
    }
    .radar-beam {
      transform-origin: 1020px 210px;
      animation: rotateRadar 10s linear infinite;
    }
    .pulse-pin {
      animation: pulse 2.5s ease-in-out infinite;
    }
    .pulse-pin-2 {
      animation: pulse 2.5s ease-in-out infinite 1.25s;
    }
    .satellite-orbit {
      transform-origin: 1020px 210px;
      animation: orbit 18s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -360; }
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { r: 6px; opacity: 1; }
      50% { r: 16px; opacity: 0.3; }
      100% { r: 6px; opacity: 1; }
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Map Coordinate Grid (Background layer) -->
  <g class="grid-layer">
    <!-- Horizontal Coordinate Lines -->
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <!-- Vertical Coordinate Lines -->
    <line x1="120" y1="0" x2="120" y2="420" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="420" class="grid-line" />
    <line x1="360" y1="0" x2="360" y2="420" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="420" class="grid-line" />
    <line x1="840" y1="0" x2="840" y2="420" class="grid-line" />
    <line x1="960" y1="0" x2="960" y2="420" class="grid-line" />
    <line x1="1080" y1="0" x2="1080" y2="420" class="grid-line" />
  </g>

  <!-- Right Side Interactive Navigation Visualization & Radar (Behind text safe zone) -->
  <g id="radar-widget">
    <!-- Concentric Range Rings -->
    <circle cx="1020" cy="210" r="140" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1.5" fill="none" />
    <circle cx="1020" cy="210" r="100" stroke="#38ef7d" stroke-opacity="0.2" stroke-width="1.5" fill="none" />
    <circle cx="1020" cy="210" r="60" stroke="#00c6ff" stroke-opacity="0.25" stroke-width="1.5" fill="none" />
    <circle cx="1020" cy="210" r="20" stroke="#38ef7d" stroke-opacity="0.4" stroke-width="1" fill="none" />

    <!-- Crosshairs -->
    <line x1="860" y1="210" x2="1180" y2="210" stroke="#00f2fe" stroke-opacity="0.2" stroke-dasharray="4,4" />
    <line x1="1020" y1="50" x2="1020" y2="370" stroke="#00f2fe" stroke-opacity="0.2" stroke-dasharray="4,4" />

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-beam">
      <path d="M 1020 210 L 1160 210 A 140 140 0 0 0 1020 70 Z" fill="url(#routeGrad)" fill-opacity="0.12" />
    </g>

    <!-- Satellite / GPS Orbit Indicator -->
    <g class="satellite-orbit">
      <circle cx="1140" cy="210" r="5" fill="#00f2fe" filter="url(#softGlow)" />
      <line x1="1020" y1="210" x2="1140" y2="210" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1" />
    </g>

    <!-- Waypoint Nodes & Dynamic Curved Route -->
    <path d="M 780 320 Q 860 140 960 250 T 1120 120" class="route-path" filter="url(#glow)" />

    <!-- Dynamic Pulsing GPS Pins -->
    <circle cx="780" cy="320" class="pulse-pin" fill="#38ef7d" />
    <circle cx="780" cy="320" r="4" fill="#ffffff" />
    
    <circle cx="960" cy="250" class="pulse-pin-2" fill="#00f2fe" />
    <circle cx="960" cy="250" r="4" fill="#ffffff" />

    <circle cx="1120" cy="120" class="pulse-pin" fill="#ff7675" />
    <circle cx="1120" cy="120" r="4" fill="#ffffff" />
  </g>

  <!-- Foreground Title and Branding Content (Kept Crystal Clear) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 65)">
      <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5" />
      <circle cx="18" cy="17" r="5" fill="#38ef7d" filter="url(#softGlow)" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="0.8">
        GEOSPATIAL &amp; NAVIGATION STACK
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
      Navigation &amp; Mapping
    </text>
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Infrastructure
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Vector Tile Servers, Multimodal Routing Engines,
    </text>
    <text x="0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Geocoding APIs, PMTiles Archives, and WebGL / Native Map Renderers.
    </text>

    <!-- Tech Badges / Component Tags -->
    <g transform="translate(0, 310)">
      <!-- Tile Server Tag -->
      <rect x="0" y="0" width="125" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="62" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#38bdf8" text-anchor="middle">⚡ Vector Tiles</text>

      <!-- Routing Tag -->
      <rect x="135" y="0" width="135" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="202" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#4ade80" text-anchor="middle">🧭 Turn-by-Turn</text>

      <!-- Geocoding Tag -->
      <rect x="280" y="0" width="120" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="340" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#f472b6" text-anchor="middle">🔍 Geocoding</text>

      <!-- OpenStreetMap Tag -->
      <rect x="410" y="0" width="150" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="485" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#fbbf24" text-anchor="middle">🌐 OpenStreetMap</text>
    </g>
  </g>

  <!-- Clean Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#routeGrad)" />
</svg>
